[package]
name = "pos-down-detector"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.7"
serde_json = "1.0.145"
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread"] }
reqwest = { version = "0.13", features = ["json", "cookies"] }
serde = { version = "1.0.188", features = ["derive"] }
tracing = "0.1.43"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
sha2 = "0.11"
dotenvy = "0.15"
hex-literal = "1.1.0"
hex = "0.4.3"
ed25519-dalek = "3.0.0"
lazy_static = "1.5.0"
twilight-model = "0.17.1"
tracing-appender = "0.2.5"
